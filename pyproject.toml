[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dobot_api_v4"
version = "4.0.0a1"
description = "Dobot Robot API V4 for TCP/IP communication with modular architecture and i18n support"
readme = "README.md"
authors = [
    { name = "Dobot", email = "support@dobot.cc" }
]
keywords = ["dobot", "robot", "tcp", "api", "automation", "robotics", "i18n"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "loguru>=0.7.0",
    "python-i18n>=0.3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "mypy>=1.0",
]
docs = [
    "sphinx>=7.3.0",
    "myst-parser>=2.0.0",
    "sphinx-markdown-builder>=0.6.6",
]

[project.urls]
Homepage = "https://github.com/Dobot-Arm/TCP-IP-Python-V4"
Documentation = "https://github.com/Dobot-Arm/TCP-IP-Python-V4/blob/main/README.md"
Repository = "https://github.com/Dobot-Arm/TCP-IP-Python-V4"
Issues = "https://github.com/Dobot-Arm/TCP-IP-Python-V4/issues"

[tool.setuptools.packages.find]
include = ["dobot_api_v4*"]

[tool.setuptools.package-data]
dobot_api_v4 = ["py.typed", "locales/*.yml"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "i18n.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: fast unit tests (no network, no hardware)",
    "integration: loopback integration tests using a local TCP stub server",
    "hil: hardware-in-the-loop tests (requires a real Dobot robot)",
]

[tool.coverage.run]
source = ["dobot_api_v4"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
