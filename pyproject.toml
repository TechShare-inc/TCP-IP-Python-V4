[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dobot_api"
version = "4.1.0"
description = "Dobot Robot API V4 for TCP/IP communication with modular architecture and i18n support"
readme = "README.md"
authors = [
    { name = "Dobot", email = "support@dobot.cc" }
]
keywords = ["dobot", "robot", "tcp", "api", "automation", "robotics", "i18n"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "loguru>=0.7.0",
    "python-i18n>=0.3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/Dobot-Arm/TCP-IP-Python-V4"
Documentation = "https://github.com/Dobot-Arm/TCP-IP-Python-V4/blob/main/README.md"
Repository = "https://github.com/Dobot-Arm/TCP-IP-Python-V4"
Issues = "https://github.com/Dobot-Arm/TCP-IP-Python-V4/issues"

[tool.setuptools.packages.find]
include = ["dobot_api*"]

[tool.setuptools.package-data]
dobot_api = ["files/*.json", "files/*.py"]
